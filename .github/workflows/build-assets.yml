# .github/workflows/build-assets.yml
# Builds binaries and uploads artifacts with cargo-binstall compatible naming.
# Does NOT create a GitHub Release – that is handled by release-assets.yml.

name: Build Binaries

on:
  workflow_call:
    inputs:
      binary_name:
        description: 'Name of the binary to build'
        type: string
        required: true

      # Optional custom build command (default: cargo build --release)
      build_command:
        description: 'Build command (defaults to cargo build --release)'
        type: string
        default: 'cargo build --release'

      # Comma-separated targets (e.g., "x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin")
      targets:
        description: 'Comma-separated targets'
        type: string
        default: 'x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin'

      # Explicit version for artifact naming
      version:
        description: 'Version string for artifact naming (e.g., v0.1.9). Defaults to github.ref_name.'
        type: string
        required: false
        default: ''

    outputs:
      # Optional: you can output the artifact names if needed by the caller
      artifact_names:
        description: 'List of artifact names produced'
        value: ${{ jobs.build-binaries.outputs.artifact_names }}

permissions:
  contents: read   # Only read is needed for building

jobs:
  build-binaries:
    name: Build binaries for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, x86_64-apple-darwin ]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          - target: x86_64-pc-windows-msvc
            os: windows-latest

          - target: x86_64-apple-darwin
            os: macos-latest
        # Filter targets based on input
        exclude:
          - target: ${{ !contains(inputs.targets, 'x86_64-unknown-linux-gnu') && 'x86_64-unknown-linux-gnu' || '' }}
          - target: ${{ !contains(inputs.targets, 'x86_64-pc-windows-msvc') && 'x86_64-pc-windows-msvc' || '' }}
          - target: ${{ !contains(inputs.targets, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ----------------------- Build -----------------------
      - name: Build
        shell: bash
        run: |
          if [[ "${{ inputs.build_command }}" == "cargo build --release" ]]; then
            cargo build --release --target ${{ matrix.target }}
          else
            CMD="${{ inputs.build_command }}"
            echo "Running: ${CMD//\${{ matrix.target }}/${{ matrix.target }}}"
            ${CMD//\${{ matrix.target }}/${{ matrix.target }}}
          fi

      # ----------------------- Package with correct version -----------------------
      - name: Package binary
        shell: bash
        env:
          # Prefer explicit version input > ref_name > fallback
          VERSION: ${{ inputs.version || github.ref_name || 'latest' }}
        run: |
          BIN="target/${{ matrix.target }}/release/${{ inputs.binary_name }}"
          [[ "${{ matrix.target }}" == *windows* ]] && BIN="$BIN.exe"

          # Use 'latest' if version is empty or a PR merge commit
          if [[ -z "${VERSION}" || "${VERSION}" == "merge" ]]; then
            VERSION="latest"
          fi

          # cargo-binstall compatible: {binary_name}-{version}-{target}.{ext}
          ARTIFACT="${{ inputs.binary_name }}-${VERSION}-${{ matrix.target }}"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${ARTIFACT}.zip" "$BIN"
          else
            tar czf "${ARTIFACT}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi
          echo "names=${ARTIFACT}.tar.gz ${ARTIFACT}.zip" >> "$GITHUB_OUTPUT"

      # ----------------------- Upload artifact -----------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary_name }}-${{ env.VERSION }}-${{ matrix.target }}
          path: ${{ inputs.binary_name }}-*-${{ matrix.target }}.*
