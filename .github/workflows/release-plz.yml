# github-workflows/.github/workflows/release-plz.yml
# Semantic release orchestration using release-plz.
# This reusable workflow publishes to crates.io and creates GitHub releases.
# It captures the release status and tag name, passing them back to the
# caller workflow so downstream jobs (like building assets) can trigger.

name: Release-plz

on:
  workflow_call:
    # Optional: Customize if you need different branches
    inputs:
      branch:
        description: 'Branch to watch for releases'
        type: string
        default: 'main'

    # Secrets that must be passed from the caller
    secrets:
      RELEASE_PLZ_TOKEN:
        required: true
      CARGO_REGISTRY_TOKEN:
        required: true

    # Expose outputs for chaining
    outputs:
      release_created:
        description: "Whether release-plz created any releases"
        value: ${{ jobs.release-plz-release.outputs.release_created }}
      tag_name:
        description: "The git tag name of the first released package"
        value: ${{ jobs.release-plz-release.outputs.tag_name }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'seyallius' }}
    permissions:
      contents: write

    # Captures outputs from specific steps within this job.
    outputs:
      release_created: ${{ steps.release-plz-step.outputs.releases_created }}
      tag_name: ${{ steps.extract-tag.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run release-plz
        id: release-plz-step
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # release-plz outputs a JSON array of releases. We use jq to extract
      # the git tag of the first release so the caller can easily use it.
      - name: Extract Tag Name
        id: extract-tag
        if: steps.release-plz-step.outputs.releases_created == 'true'
        run: |
          # Parse the JSON array and grab the 'tag' property of the first item
          TAG=$(echo '${{ steps.release-plz-step.outputs.releases }}' | jq -r '.[0].tag')
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Released tag: $TAG"

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'seyallius' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
