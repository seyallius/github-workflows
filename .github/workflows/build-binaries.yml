# .github/workflows/build-binaries.yml (DEPRECATED)
# Builds and uploads release binaries with standard Rust target triple naming.
#
# ⚠️ THIS WORKFLOW IS DEPRECATED ⚠️
# Please migrate to the new separated workflows:
#   - build-assets.yml  (reusable build)
#   - release-assets.yml  (reusable release)
# See https://github.com/seyallius/github-workflows#migration-guide

name: Build & Release Binaries (DEPRECATED)

on:
  workflow_call:
    inputs:
      # The binary name (the name of your crate)
      binary_name:
        description: 'Name of the binary to build'
        type: string
        required: true

      # Optional custom build command
      build_command:
        description: 'Build command (defaults to cargo build)'
        type: string
        default: 'cargo build --release'

      # Targets to build (space separated)
      targets:
        description: 'Comma-separated targets (e.g., "x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin")'
        type: string
        default: 'x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin'

      # Allow users to suppress the deprecation warning (default: false)
      ignore_deprecation:
        description: 'Suppress the deprecation warning and continue'
        type: boolean
        default: false

      # Force failure after a certain date (optional)
      enforce_migration_date:
        description: 'Date after which the workflow will fail (YYYY-MM-DD)'
        type: string
        default: '2027-01-01'   # example

permissions:
  contents: write

jobs:
  deprecation-warning:
    runs-on: ubuntu-latest
    steps:
      - name: ⚠️ Deprecation Notice
        shell: bash
        run: |
          echo "::warning::This workflow (build-binaries.yml) is DEPRECATED."
          echo "::warning::Please migrate to the new separated workflows:"
          echo "::warning::  - build-assets.yml (for building)"
          echo "::warning::  - release-assets.yml (for creating releases)"
          echo "::warning::See the migration guide: https://github.com/seyallius/github-workflows#migration"

          if [[ "${{ inputs.ignore_deprecation }}" != "true" ]]; then
            echo "::warning::To temporarily suppress this warning, set 'ignore_deprecation: true'"
          else
            echo "::notice::Deprecation warning suppressed by 'ignore_deprecation'"
          fi

          # fail if after a certain date
          ENFORCE_DATE="${{ inputs.enforce_migration_date }}"
          if [[ -n "$ENFORCE_DATE" ]]; then
            CURRENT_DATE=$(date +%Y-%m-%d)
            if [[ "$CURRENT_DATE" > "$ENFORCE_DATE" ]]; then
              if [[ "${{ inputs.ignore_deprecation }}" != "true" ]]; then
                echo "::error::Deprecation period ended on $ENFORCE_DATE. Please migrate immediately."
                exit 1
              else
                echo "::warning::Deprecation period ended, but 'ignore_deprecation' is true. Please migrate soon."
              fi
            fi
          fi

  build-binaries:
    name: Build binaries for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, x86_64-apple-darwin]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          - target: x86_64-pc-windows-msvc
            os: windows-latest

          - target: x86_64-apple-darwin
            os: macos-latest
        # Filter targets based on input
        exclude:
          - target: ${{ !contains(inputs.targets, 'x86_64-unknown-linux-gnu') && 'x86_64-unknown-linux-gnu' || '' }}
          - target: ${{ !contains(inputs.targets, 'x86_64-pc-windows-msvc') && 'x86_64-pc-windows-msvc' || '' }}
          - target: ${{ !contains(inputs.targets, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Use the custom build command or default
      - name: Build
        shell: bash
        run: |
          if [[ "${{ inputs.build_command }}" == "cargo build --release" ]]; then
            cargo build --release --target ${{ matrix.target }}
          else
            # Use custom command - replace ${{ matrix.target }} if present
            CMD="${{ inputs.build_command }}"
            echo "Running: ${CMD//\${{ matrix.target }}/${{ matrix.target }}}"
            ${CMD//\${{ matrix.target }}/${{ matrix.target }}}
          fi

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ github.ref_name || 'latest' }}
        run: |
          BIN="target/${{ matrix.target }}/release/${{ inputs.binary_name }}"
          [[ "${{ matrix.target }}" == *windows* ]] && BIN="$BIN.exe"

          # Use 'latest' if version is empty or a PR merge commit
          if [[ -z "${VERSION}" || "${VERSION}" == "merge" ]]; then
            VERSION="latest"
          fi

          # Standard naming: {binary_name}-{version}-{target}.{ext}
          ARTIFACT="${{ inputs.binary_name }}-${VERSION}-${{ matrix.target }}"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${ARTIFACT}.zip" "$BIN"
          else
            tar czf "${ARTIFACT}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary_name }}-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ inputs.binary_name }}-${{ github.ref_name || 'latest' }}-${{ matrix.target }}.*

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    # Only run if this is a tag push (not for PRs or branches)
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.binary_name }}-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ inputs.binary_name }}-*.tar.gz
            ${{ inputs.binary_name }}-*.zip
          generate_release_notes: true
