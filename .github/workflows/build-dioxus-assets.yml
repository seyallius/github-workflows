# .github/workflows/build-dioxus-assets.yml
# Builds Dioxus app bundles for Linux, macOS, Windows.
# Uploads artifacts but does NOT create a GitHub Release.

name: Build Dioxus App

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Name of the Dioxus app'
        type: string
        required: true

      build_linux:
        description: 'Build Linux packages (deb, AppImage, rpm)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS .dmg'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows .msi'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (.deb + AppImage)
    runs-on: ubuntu-24.04
    if: ${{ inputs.build_linux }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            fuse \
            desktop-file-utils \
            libgdk-pixbuf2.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-binstall
        uses: actions/cache@v4
        id: cache-binstall
        with:
          path: |
            ~/.cargo/bin/cargo-binstall
            ~/.cargo/bin/binstall
          key: ${{ runner.os }}-cargo-binstall-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-binstall
        if: steps.cache-binstall.outputs.cache-hit != 'true'
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Cache dioxus-cli
        uses: actions/cache@v4
        id: cache-dioxus
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/dioxus
            ~/.cargo/bin/dioxus-cli
          key: ${{ runner.os }}-dioxus-cli-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dioxus-cli
        if: steps.cache-dioxus.outputs.cache-hit != 'true'
        run: cargo binstall dioxus-cli --no-confirm --locked

      - name: Bundle
        run: dx bundle --release --package-types deb --package-types appimage --package-types rpm

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: warn

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: warn

  build-macos:
    name: macOS (.dmg)
    runs-on: macos-14
    if: ${{ inputs.build_macos }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-binstall
        uses: actions/cache@v4
        id: cache-binstall
        with:
          path: |
            ~/.cargo/bin/cargo-binstall
            ~/.cargo/bin/binstall
          key: ${{ runner.os }}-cargo-binstall-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-binstall
        if: steps.cache-binstall.outputs.cache-hit != 'true'
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Cache dioxus-cli
        uses: actions/cache@v4
        id: cache-dioxus
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/dioxus
            ~/.cargo/bin/dioxus-cli
          key: ${{ runner.os }}-dioxus-cli-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dioxus-cli
        if: steps.cache-dioxus.outputs.cache-hit != 'true'
        run: cargo binstall dioxus-cli --no-confirm --locked

      - name: Bundle
        run: dx bundle --release --package-types dmg

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: warn

  build-windows:
    name: Windows (.msi)
    runs-on: windows-latest
    if: ${{ inputs.build_windows }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install WiX Toolset (Chocolatey)
        run: choco install wixtoolset -y --no-progress

      - name: Verify WiX
        run: wix --version

      - name: Cache cargo-binstall
        uses: actions/cache@v4
        id: cache-binstall
        with:
          path: |
            ~\.cargo\bin\cargo-binstall.exe
            ~\.cargo\bin\binstall.exe
          key: ${{ runner.os }}-cargo-binstall-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-binstall
        if: steps.cache-binstall.outputs.cache-hit != 'true'
        shell: bash
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Cache dioxus-cli
        uses: actions/cache@v4
        id: cache-dioxus
        with:
          path: |
            ~\.cargo\bin\dx.exe
            ~\.cargo\bin\dioxus.exe
            ~\.cargo\bin\dioxus-cli.exe
          key: ${{ runner.os }}-dioxus-cli-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dioxus-cli
        if: steps.cache-dioxus.outputs.cache-hit != 'true'
        shell: bash
        run: cargo binstall dioxus-cli --no-confirm --locked

      - name: Bundle
        run: dx bundle --release --package-types msi --verbose 2>&1 | tee bundle.log

      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi
          if-no-files-found: warn
