# .github/workflows/build-assets.yml
# Builds binaries and uploads artifacts.
# Does NOT create a GitHub Release – that is handled by a separate workflow.

name: Build Binaries

on:
  workflow_call:
    inputs:
      binary_name:
        description: 'Name of the binary to build'
        type: string
        required: true

      # Optional custom build command (default: cargo build --release)
      build_command:
        description: 'Build command (defaults to cargo build --release)'
        type: string
        default: 'cargo build --release'

      # Comma-separated targets (e.g., "x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin")
      targets:
        description: 'Comma-separated targets'
        type: string
        default: 'x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin'

    outputs:
      # Optional: you can output the artifact names if needed by the caller
      artifact_names:
        description: 'List of artifact names produced'
        value: ${{ jobs.build-binaries.outputs.artifact_names }}

permissions:
  contents: read   # Only read is needed for building

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Expand the comma-separated targets into a list
        target: ${{ fromJson(format('["{0}"]', join(split(inputs.targets, ','), '","'))) }}
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          - target: x86_64-pc-windows-msvc
            os: windows-latest

          - target: x86_64-apple-darwin
            os: macos-latest

    outputs:
      # We'll set this dynamically after packaging
      artifact_names: ${{ steps.package.outputs.names }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          if [[ "${{ inputs.build_command }}" == "cargo build --release" ]]; then
            cargo build --release --target ${{ matrix.target }}
          else
            CMD="${{ inputs.build_command }}"
            echo "Running: ${CMD//\${{ matrix.target }}/${{ matrix.target }}}"
            ${CMD//\${{ matrix.target }}/${{ matrix.target }}}
          fi

      - name: Package binary
        id: package
        shell: bash
        env:
          VERSION: ${{ github.ref_name || 'latest' }}
        run: |
          BIN="target/${{ matrix.target }}/release/${{ inputs.binary_name }}"
          [[ "${{ matrix.target }}" == *windows* ]] && BIN="$BIN.exe"

          if [[ -z "${VERSION}" || "${VERSION}" == "merge" ]]; then
            VERSION="latest"
          fi

          ARTIFACT="${{ inputs.binary_name }}-${VERSION}-${{ matrix.target }}"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${ARTIFACT}.zip" "$BIN"
          else
            tar czf "${ARTIFACT}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi

          # Store the artifact name for output
          echo "names=${ARTIFACT}.tar.gz ${ARTIFACT}.zip" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary_name }}-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ inputs.binary_name }}-${{ github.ref_name || 'latest' }}-${{ matrix.target }}.*
